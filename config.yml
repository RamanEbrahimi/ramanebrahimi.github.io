          title: Raman Ebrahimi
          subtitle: "I am a Ph.D. student in Machine Learning and Data Science at the University of California San Diego, advised by [Dr. Massimo Franceschetti](http://web.eng.ucsd.edu/~massimo/Home.html). My research interests are in behavioral game theory, strategic classification, network games, and agentic AI systems for research.<br><br> I study how strategic agents behave on networks and in front of algorithms: existence, uniqueness and stability of Nash equilibria in multiplex, multilayer and K-hop network games (spectral graph theory, P-matrices); how network opacity and homophily distort beliefs and induce systematic cognitive biases (the “Connected Minds” framework); and strategic classification under bounded rationality, validated with large-scale user studies. I also evaluate large language models as zero-shot navigators of information networks.<br><br> Currently, as a Data Solutions Engineer at HCM Tradeseal, I build full-stack AI systems: a Slack support agent over live Zendesk tickets, Python/Playwright automation of customer sandboxes, and the WageFinder prevailing-wage data platform (FastAPI, 5.9M records across 55 federal jurisdictions) with estimator-facing forecasting and compliance products. Until June 2026 I was a Machine Learning Engineer and Quantitative Researcher at MarketCrunch AI, redesigning prediction ensembles for 2,100+ equities, running SHAP-based model diagnostics, and building the MarketPulse signal service and an automated trading system.<br><br> On the side I build tools I want to exist: a self-hosted agentic research pipeline on a GPU workstation, an open-source Claude Code research plugin, Antipode (a debate platform), and First Assist, which finds undocumented boulders from LiDAR. See [Projects](projects/).<br><br> Before coming to UCSD, I earned dual Bachelor’s degrees in Industrial Engineering and Physics from Sharif University of Technology in Tehran, Iran. Beyond academics, I’m passionate about how financial markets and complex systems work, I enjoy photography, and rock climbing!<br><br>Thanks for visiting my webpage!<br><br><details><summary><b>Previously:</b></summary><ul><li><b>Graduate Student Researcher, Multi-agent Intelligence and Decision Systems (MINDS) lab, UCSD (2022–2025):</b> I developed game-theoretic frameworks and ML models incorporating cognitive biases, analyzed Nash equilibrium conditions in multilayer network games to derive policy insights from real-world data, and designed interactive strategy games with ML-driven simulations to study strategic behavior.</li><li><b>Data Analyst Intern at the American Institute for Behavioral Research and Technology (AIBRT), Dec 2024–Feb 2025:</b> I revived a legacy Python/SQL graphing application for the ‘Generativity Theory’ project, integrating PyTorch and scikit-learn models for user-agnostic behavior prediction (over 90% accuracy in select modes) and building recording and visualization tools for behavioral analysis.</li><li><b>Data Science Product Manager at the Scientific Association of Industrial Engineering (2019–2021):</b> I led a team of computer science students building a real-time strategy game in Unity, designed the in-game economy, ran market predictions and simulations to test servers and find exploits, and monitored live competition data to detect anomalies.</li></ul></details>"
        
